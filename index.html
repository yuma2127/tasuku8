<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - クラウドタスク管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <!-- Top Header Navigation -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- App Logo & Title -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-check text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">TaskMaster</h1>
                    <p class="text-xs font-medium text-slate-500">クラウドタスク管理</p>
                </div>
            </div>

            <!-- User Profile & Account Actions -->
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 bg-slate-100 hover:bg-slate-200/80 transition px-3 py-1.5 rounded-full cursor-pointer">
                    <div class="w-7 h-7 rounded-full bg-slate-400 text-white flex items-center justify-center text-xs font-semibold">
                        裕真
                    </div>
                    <span class="text-sm font-medium text-slate-700">河野裕真</span>
                </div>
                <button title="ログアウト" onclick="showToast('ログアウト機能はデモ用です')" class="text-slate-400 hover:text-slate-600 transition p-2 rounded-lg hover:bg-slate-100">
                    <i class="fa-solid fa-right-from-bracket text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 space-y-6 flex-1 w-full">

        <!-- Stats Dashboard Cards Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Card 1: Total Tasks -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">全タスク</p>
                    <p id="stat-total" class="text-3xl font-bold text-slate-900">0</p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-600 flex items-center justify-center">
                    <i class="fa-solid fa-list-check text-xl"></i>
                </div>
            </div>

            <!-- Card 2: In Progress -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">進行中</p>
                    <p id="stat-in-progress" class="text-3xl font-bold text-amber-500">0</p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center">
                    <i class="fa-solid fa-spinner fa-spin text-xl"></i>
                </div>
            </div>

            <!-- Card 3: Completed -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">完了済み</p>
                    <p id="stat-completed" class="text-3xl font-bold text-emerald-500">0</p>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center">
                    <i class="fa-solid fa-circle-check text-xl"></i>
                </div>
            </div>

            <!-- Card 4: Completion Rate -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">達成率</p>
                    <p id="stat-rate" class="text-sm font-bold text-blue-600">0%</p>
                </div>
                <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden mt-3">
                    <div id="stat-progress-bar" class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Search and Filter Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col lg:flex-row items-center justify-between gap-4">
            <!-- Search Box -->
            <div class="relative w-full lg:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="タスクを検索..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div class="flex flex-wrap items-center justify-end gap-3 w-full lg:w-auto">
                <!-- Status Filter Tabs -->
                <div class="bg-slate-100 p-1 rounded-xl flex space-x-1 text-xs font-medium text-slate-600">
                    <button id="filter-all" onclick="setFilter('all')" class="filter-tab px-3 py-1.5 rounded-lg transition bg-white text-slate-900 shadow-sm">すべて</button>
                    <button id="filter-pending" onclick="setFilter('pending')" class="filter-tab px-3 py-1.5 rounded-lg transition hover:text-slate-900">未完了</button>
                    <button id="filter-completed" onclick="setFilter('completed')" class="filter-tab px-3 py-1.5 rounded-lg transition hover:text-slate-900">完了</button>
                </div>

                <!-- Priority Select Filter -->
                <select id="priority-filter" onchange="renderTasks()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                    <option value="all">すべての優先度</option>
                    <option value="high">高 (High)</option>
                    <option value="medium">中 (Medium)</option>
                    <option value="low">低 (Low)</option>
                </select>

                <!-- Add Task Button -->
                <button onclick="openModal()" class="w-full sm:w-auto px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium flex items-center justify-center space-x-2 transition shadow-sm shadow-blue-500/20 active:scale-[0.98]">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>タスク追加</span>
                </button>
            </div>
        </div>

        <!-- Task List Container -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div id="task-list" class="divide-y divide-slate-100">
                <!-- Dynamic task items injected here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden py-16 text-center space-y-3">
                <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto">
                    <i class="fa-solid fa-inbox text-xl"></i>
                </div>
                <p class="text-slate-500 font-medium text-sm">該当するタスクが見つかりません</p>
                <p class="text-slate-400 text-xs">新しいタスクを追加するか、検索条件を変更してください。</p>
            </div>
        </div>
    </main>

    <!-- Modal for Adding / Editing Task -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg mx-4 overflow-hidden border border-slate-100">
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">タスクを追加</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="task-form" onsubmit="saveTask(event)" class="p-6 space-y-4">
                <input type="hidden" id="task-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="task-title" required placeholder="タスクのタイトルを入力..." 
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">詳細説明</label>
                    <textarea id="task-desc" rows="3" placeholder="タスクの詳細やメモを入力..." 
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">優先度</label>
                        <select id="task-priority" class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                            <option value="high">高 (High)</option>
                            <option value="medium" selected>中 (Medium)</option>
                            <option value="low">低 (Low)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">期限</label>
                        <input type="date" id="task-due-date" 
                            class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-xl text-sm font-medium transition">
                        キャンセル
                    </button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition shadow-sm shadow-blue-500/20">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg z-50 hidden opacity-0 transition-all duration-300 transform translate-y-2">
        <span id="toast-message">操作が完了しました</span>
    </div>

    <script>
        // Default Mock Data if local storage is empty
        const initialTasks = [
            {
                id: '1',
                title: '新規ダッシュボードUIのデザイン確認',
                description: 'レスポンシブデザインと配色アクセシビリティの修正を行う',
                priority: 'high',
                completed: false,
                dueDate: '2026-10-05'
            },
            {
                id: '2',
                title: 'GitHub Pagesでの単一ファイル動作テスト',
                description: 'Localstorageとの同期およびフィルタリング動作の全テスト実施',
                priority: 'medium',
                completed: true,
                dueDate: '2026-09-29'
            }
        ];

        // State Store
        let tasks = JSON.parse(localStorage.getItem('taskmaster_tasks')) || initialTasks;
        let currentFilter = 'all';

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            renderTasks();
            document.getElementById('search-input').addEventListener('input', renderTasks);
        });

        // Save State to LocalStorage
        function saveToStorage() {
            localStorage.setItem('taskmaster_tasks', JSON.stringify(tasks));
        }

        // Display Toast Message
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        // Set Tab Status Filter
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
                btn.classList.add('hover:text-slate-900');
            });

            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
            }

            renderTasks();
        }

        // Calculate & Update Dashboard Statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const inProgress = total - completed;
            const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-in-progress').innerText = inProgress;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-rate').innerText = `${rate}%`;
            document.getElementById('stat-progress-bar').style.width = `${rate}%`;
        }

        // Render Filtered Task List
        function renderTasks() {
            updateStats();

            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            const priorityFilter = document.getElementById('priority-filter').value;

            const filtered = tasks.filter(task => {
                // Status Filter
                if (currentFilter === 'pending' && task.completed) return false;
                if (currentFilter === 'completed' && !task.completed) return false;

                // Priority Filter
                if (priorityFilter !== 'all' && task.priority !== priorityFilter) return false;

                // Search Match
                if (searchQuery) {
                    const titleMatch = task.title.toLowerCase().includes(searchQuery);
                    const descMatch = task.description.toLowerCase().includes(searchQuery);
                    return titleMatch || descMatch;
                }

                return true;
            });

            const listContainer = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');

            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                listContainer.innerHTML = filtered.map(task => {
                    const priority Badges = {
                        high: '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-100">高</span>',
                        medium: '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-600 border border-amber-100">中</span>',
                        low: '<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200">低</span>'
                    };

                    return `
                        <div class="p-4 sm:p-5 flex items-start justify-between gap-4 transition hover:bg-slate-50/80 ${task.completed ? 'opacity-60 bg-slate-50/40' : ''}">
                            <div class="flex items-start space-x-3.5 flex-1 min-w-0">
                                <button onclick="toggleTask('${task.id}')" title="${task.completed ? '未完了に戻す' : '完了にする'}" class="mt-0.5 text-slate-300 hover:text-blue-600 transition flex-shrink-0">
                                    ${task.completed 
                                        ? '<i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>' 
                                        : '<i class="fa-regular fa-circle text-slate-300 text-xl hover:text-blue-600"></i>'}
                                </button>
                                <div class="space-y-1 flex-1 min-w-0">
                                    <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                                        <h4 class="text-sm font-semibold ${task.completed ? 'line-through text-slate-400' : 'text-slate-900'} truncate">
                                            ${escapeHtml(task.title)}
                                        </h4>
                                        ${priorityBadges[task.priority] || ''}
                                    </div>
                                    ${task.description ? `<p class="text-xs text-slate-500 line-clamp-2">${escapeHtml(task.description)}</p>` : ''}
                                    ${task.dueDate ? `
                                        <div class="flex items-center text-xs text-slate-400 space-x-1.5 pt-1">
                                            <i class="fa-regular fa-calendar"></i>
                                            <span>${task.dueDate}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            
                            <!-- Action buttons -->
                            <div class="flex items-center space-x-1 flex-shrink-0">
                                <button onclick="openModal('${task.id}')" title="編集" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition">
                                    <i class="fa-solid fa-pen-to-square text-sm"></i>
                                </button>
                                <button onclick="deleteTask('${task.id}')" title="削除" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        // Toggle Task Completion State
        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveToStorage();
            renderTasks();
            showToast('ステータスを更新しました');
        }

        // Delete Task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveToStorage();
            renderTasks();
            showToast('タスクを削除しました');
        }

        // Modal Open
        function openModal(id = null) {
            const modal = document.getElementById('task-modal');
            const form = document.getElementById('task-form');
            const modalTitle = document.getElementById('modal-title');

            form.reset();
            document.getElementById('task-id').value = '';

            if (id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    modalTitle.innerText = 'タスクを編集';
                    document.getElementById('task-id').value = task.id;
                    document.getElementById('task-title').value = task.title;
                    document.getElementById('task-desc').value = task.description || '';
                    document.getElementById('task-priority').value = task.priority;
                    document.getElementById('task-due-date').value = task.dueDate || '';
                }
            } else {
                modalTitle.innerText = 'タスクを追加';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        // Modal Close
        function closeModal() {
            const modal = document.getElementById('task-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Save Form Handler
        function saveTask(event) {
            event.preventDefault();
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value.trim();
            const description = document.getElementById('task-desc').value.trim();
            const priority = document.getElementById('task-priority').value;
            const dueDate = document.getElementById('task-due-date').value;

            if (!title) return;

            if (id) {
                // Edit existing
                tasks = tasks.map(t => t.id === id ? { ...t, title, description, priority, dueDate } : t);
                showToast('タスクを更新しました');
            } else {
                // Add new
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    description,
                    priority,
                    dueDate,
                    completed: false
                };
                tasks.unshift(newTask);
                showToast('新しいタスクを追加しました');
            }

            saveToStorage();
            renderTasks();
            closeModal();
        }

        // HTML Escape Utility
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
